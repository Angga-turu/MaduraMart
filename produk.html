<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk - MaduraMart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css?v=17">
  <link rel="stylesheet" href="assets/css/kasir.css?v=17">
  <link rel="stylesheet" href="assets/css/produk.css?v=17">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol><symbol id="i-kasir" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/></symbol><symbol id="i-produk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol><symbol id="i-laporan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol><symbol id="i-atur" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol><symbol id="i-keluar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></symbol><symbol id="i-cari" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol><symbol id="i-tambah" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol><symbol id="i-hapus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol></svg>

  <div class="app" id="app" hidden>
    <aside class="samping" id="samping">
      <div class="profil">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="profil-teks"><strong id="pengguna"></strong><span>Administrator</span></div>
      </div>
      <nav class="nav" aria-label="Menu utama">
        <button class="item" type="button" data-ke="dashboard.html"><svg class="ikon" width="20" height="20"><use href="#i-home"/></svg>Dashboard</button>
        <button class="item" type="button" data-ke="kasir.html"><svg class="ikon" width="20" height="20"><use href="#i-kasir"/></svg>Kasir</button>
        <button class="item aktif" type="button" aria-current="page"><svg class="ikon" width="20" height="20"><use href="#i-produk"/></svg>Produk</button>
        <button class="item" type="button" data-ke="laporan.html"><svg class="ikon" width="20" height="20"><use href="#i-laporan"/></svg>Laporan</button>
        <button class="item" type="button" data-segera="Pengaturan"><svg class="ikon" width="20" height="20"><use href="#i-atur"/></svg>Pengaturan</button>
      </nav>
      <button class="item keluar" id="keluar" type="button"><svg class="ikon" width="20" height="20"><use href="#i-keluar"/></svg>Keluar</button>
    </aside>
    <div class="tirai" id="tirai"></div>

    <div class="utama">
      <header class="bar">
        <button class="hamburger" id="buka" type="button" aria-label="Buka menu"><svg class="ikon" width="22" height="22"><use href="#i-menu"/></svg></button>
        <h1 class="judul">Produk</h1>
        <div class="waktu"><span id="tanggal"></span><b id="jam"></b></div>
      </header>

      <main class="halaman">
        <div class="alat-produk">
          <div class="cari">
            <svg class="ikon" width="20" height="20"><use href="#i-cari"/></svg>
            <input id="cari" type="search" placeholder="Cari produk" aria-label="Cari produk" autocomplete="off">
          </div>
          <select class="pilih" id="saring" aria-label="Saring kategori"></select>
          <button class="tombol gelap" id="tambah" type="button"><svg class="ikon" width="18" height="18"><use href="#i-tambah"/></svg>Tambah produk</button>
        </div>

        <section class="kartu kartu-tabel">
          <div class="kepala"><h3>Daftar produk</h3><span id="ringkas"></span></div>
          <div class="gulir">
            <table class="tabel-produk" id="tabel" hidden>
              <thead><tr><th>Produk</th><th>Kategori</th><th class="angka">Harga</th><th class="angka">Stok</th><th><span class="sr-only">Aksi</span></th></tr></thead>
              <tbody id="isi"></tbody>
            </table>
          </div>
          <p class="kosong-teks" id="kosong" hidden></p>
        </section>
      </main>
    </div>
  </div>

  <dialog id="dlg-form" aria-labelledby="judul-form">
    <form class="dlg" id="form" novalidate>
      <h2 id="judul-form">Tambah produk</h2>
      <p class="lihat">Isi data produk, lalu simpan.</p>
      <div class="medan"><label for="f-nama">Nama produk</label><input id="f-nama" type="text" maxlength="80" autocomplete="off"></div>
      <div class="medan"><label for="f-kategori">Kategori</label><input id="f-kategori" type="text" maxlength="40" list="saran-kategori" placeholder="Contoh: Minuman" autocomplete="off"><datalist id="saran-kategori"></datalist></div>
      <div class="baris-2">
        <div class="medan"><label for="f-harga">Harga (Rp)</label><input id="f-harga" type="number" inputmode="numeric" min="0" step="500"></div>
        <div class="medan"><label for="f-stok">Stok</label><input id="f-stok" type="number" inputmode="numeric" min="0" step="1"></div>
      </div>
      <p class="galat-form" id="galat-form" role="alert" hidden></p>
      <div class="dlg-aksi">
        <button class="tombol terang" id="batal-form" type="button">Batal</button>
        <button class="tombol gelap" id="simpan" type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-hapus" aria-labelledby="judul-hapus">
    <div class="dlg">
      <h2 id="judul-hapus">Hapus produk?</h2>
      <p class="lihat"><strong id="nama-hapus"></strong> akan dihapus dari daftar produk. Riwayat transaksi lama tidak berubah.</p>
      <div class="dlg-aksi">
        <button class="tombol terang" id="batal-hapus" type="button">Batal</button>
        <button class="tombol bahaya" id="ya-hapus" type="button">Hapus</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/db.js?v=17"></script>
  <script src="assets/js/shell.js?v=17"></script>
  <script src="assets/js/produk.js?v=17"></script>
</body>
</html>
