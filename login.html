<!DOCTYPE html>
<html lang="id">
<!-- versi-login-google: halaman masuk dan daftar, CSS dan JS digabung di file ini -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - MaduraMart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
svg { width: 20px; height: 20px; }
:root {
  --latar: #ffd23f;
  --kertas: #fcfbf7;
  --tinta: #1d2b3a;
  --samar: #5b6773;
  --galat: #b42318;
  --aksen: #0f766e;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--latar);
  color: var(--tinta);
  font-family: "Courier Prime", "Courier New", monospace;
  font-size: 15px;
  line-height: 1.5;
}

.kartu {
  position: relative;
  width: min(360px, 100%);
  padding: 32px 26px 26px;
  background: var(--kertas);
  box-shadow: 0 8px 18px rgba(29, 43, 58, 0.15);
}

/* Tepi bawah bergerigi seperti struk */
.kartu::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 10px;
  background:
    linear-gradient(-45deg, transparent 5px, var(--kertas) 0) 0 0 / 10px 10px,
    linear-gradient(45deg, transparent 5px, var(--kertas) 0) 0 0 / 10px 10px;
}

h1 {
  margin: 0 0 22px;
  padding-bottom: 20px;
  font-size: 28px;
  text-align: center;
  border-bottom: 2px dashed var(--samar);
}

label { display: block; margin-bottom: 4px; font-weight: 700; }

.kolom {
  position: relative;
  margin-bottom: 16px;
}

.ikon, .mata svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ikon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--samar);
  pointer-events: none;
}

input::placeholder { color: #8a949e; }

input {
  width: 100%;
  padding: 10px 12px 10px 42px;
  font: inherit;
  color: var(--tinta);
  background: #fff;
  border: 2px solid var(--tinta);
  border-radius: 0;
}

input:focus-visible, button:focus-visible, a:focus-visible {
  outline: 3px solid var(--aksen);
  outline-offset: 2px;
}

button {
  width: 100%;
  padding: 11px 14px;
  font: inherit;
  font-weight: 700;
  color: var(--kertas);
  background: var(--tinta);
  border: 0;
  cursor: pointer;
}

input.ada-mata { padding-right: 46px; }

/* Tombol mata untuk menampilkan atau menyembunyikan kata sandi */
.kolom .mata {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--samar);
  background: transparent;
}

.kolom .mata:hover { color: var(--aksen); background: transparent; }
.kolom .mata .mata-tutup { display: none; }
.kolom .mata.tampil .mata-buka { display: none; }
.kolom .mata.tampil .mata-tutup { display: block; }

button:hover { background: var(--aksen); }
button:disabled { opacity: 0.6; cursor: wait; }

.galat {
  margin: -4px 0 14px;
  color: var(--galat);
  font-size: 14px;
}

.bantuan {
  margin: 20px 0 0;
  text-align: center;
  font-size: 14px;
  color: var(--samar);
}

.bantuan a { color: var(--aksen); font-weight: 700; }

/* Dashboard sementara */
.kartu .keluar { margin-top: 22px; }
.kartu .kosong { margin: 0; text-align: center; color: var(--samar); }

.kartu { width: min(390px, 100%); }
h1 { margin-bottom: 18px; padding-bottom: 18px; }

/* Tab Masuk / Daftar */
.tab { display: grid; grid-template-columns: 1fr 1fr; margin: 0 0 20px; border: 2px solid var(--tinta); }
.tab button { width: auto; padding: 9px; color: var(--tinta); background: transparent; }
.tab button.aktif { color: var(--kertas); background: var(--tinta); }
.tab button:hover:not(.aktif) { background: rgba(29, 43, 58, 0.09); }

.tautan { display: inline; width: auto; padding: 0; color: var(--aksen); background: none; font-weight: 700; text-decoration: underline; }
.tautan:hover { background: none; color: var(--tinta); }
.ganti { margin: 16px 0 0; text-align: center; font-size: 14px; color: var(--samar); }
.kecil { margin: -8px 0 14px; font-size: 13px; color: var(--samar); }

.pemisah { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: var(--samar); font-size: 14px; }
.pemisah::before, .pemisah::after { content: ""; flex: 1; border-top: 2px dashed var(--samar); opacity: 0.6; }
.google { display: flex; justify-content: center; min-height: 44px; }
.google-mati { width: 100%; padding: 11px 14px; color: var(--samar); background: #fff; border: 2px solid var(--samar); }
.google-mati:hover { background: #fff; color: var(--tinta); border-color: var(--tinta); }
.info { margin: 10px 0 0; font-size: 13px; color: var(--galat); text-align: center; }
[hidden] { display: none !important; }
.hukum { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--samar); }
.hukum a { color: var(--samar); }
</style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="kartu">
    <h1>MaduraMart</h1>

    <div class="tab" role="tablist" aria-label="Masuk atau daftar">
      <button id="tab-masuk" class="aktif" type="button" role="tab" aria-selected="true">Masuk</button>
      <button id="tab-daftar" type="button" role="tab" aria-selected="false">Daftar</button>
    </div>

    <section id="panel-masuk">
      <form id="form-masuk" novalidate>
      <label for="m-user">Nama pengguna</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <input id="m-user" type="text" placeholder="Masukkan nama pengguna" autocomplete="username" autocapitalize="none">
        
      </div>
      <label for="m-sandi">Kata sandi</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="m-sandi" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" class="ada-mata">
        <button class="mata" type="button" data-target="m-sandi" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg class="mata-buka" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="mata-tutup" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.7A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
      </div>

        <p id="galat-masuk" class="galat" role="alert" hidden></p>
        <button id="tombol-masuk" type="submit">Masuk</button>
      </form>
      <p class="ganti">Belum punya akun? <button class="tautan" id="ke-daftar" type="button">Daftar</button></p>
    </section>

    <section id="panel-daftar" hidden>
      <form id="form-daftar" novalidate>
      <label for="d-nama">Nama lengkap</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M14 9h4M14 13h4M6 16c.6-1.2 1.6-1.8 3-1.8s2.4.6 3 1.8"/></svg>
        <input id="d-nama" type="text" placeholder="Masukkan nama lengkap" autocomplete="name" maxlength="30">
        
      </div>
      <label for="d-user">Nama pengguna</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        <input id="d-user" type="text" placeholder="Contoh: toko_madura" autocomplete="username" autocapitalize="none" maxlength="20">
        
      </div>
      <p class="kecil">Huruf kecil, angka, atau garis bawah (3 sampai 20 karakter).</p>
      <label for="d-sandi">Kata sandi</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="d-sandi" type="password" placeholder="Minimal 6 karakter" autocomplete="new-password" class="ada-mata">
        <button class="mata" type="button" data-target="d-sandi" aria-label="Tampilkan kata sandi" aria-pressed="false"><svg class="mata-buka" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="mata-tutup" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 7.7A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
      </div>
      <label for="d-ulang">Ulangi kata sandi</label>
      <div class="kolom">
        <svg class="ikon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="d-ulang" type="password" placeholder="Ketik ulang kata sandi" autocomplete="new-password">
        
      </div>

        <p id="galat-daftar" class="galat" role="alert" hidden></p>
        <button id="tombol-daftar" type="submit">Buat akun</button>
      </form>
      <p class="ganti">Sudah punya akun? <button class="tautan" id="ke-masuk" type="button">Masuk</button></p>
    </section>

    <div class="pemisah"><span>atau</span></div>
    <div id="tombol-google" class="google"></div>
    <p id="info-google" class="info" hidden></p>

    <p class="bantuan">Butuh bantuan? | <a href="https://wa.me/6287717682382" target="_blank" rel="noopener">Hubungi Admin!</a></p>
    <p class="hukum"><a href="privasi.html">Kebijakan Privasi</a> | <a href="ketentuan.html">Ketentuan Layanan</a></p>
  </main>

  <script src="assets/js/konfigurasi.js?v=21"></script>
  <script src="assets/js/db.js?v=21"></script>
  <script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // Datang dari halaman aplikasi berarti halaman itu menolak sesinya: reset sesi agar tidak berputar.
  var dariAplikasi = /dashboard|kasir|produk|laporan|pengaturan/.test(document.referrer) || /dari=/.test(window.location.search);

  function galat(id, teks) { var e = $(id); e.textContent = teks || ''; e.hidden = !teks; }
  function keDashboard() { window.location.replace('dashboard.html'); }

  // ---------- Tab Masuk / Daftar ----------
  function tampilTab(nama) {
    ['masuk', 'daftar'].forEach(function (t) {
      var aktif = t === nama;
      $('tab-' + t).classList.toggle('aktif', aktif);
      $('tab-' + t).setAttribute('aria-selected', String(aktif));
      $('panel-' + t).hidden = !aktif;
    });
    galat('galat-masuk', ''); galat('galat-daftar', '');
  }
  $('tab-masuk').addEventListener('click', function () { tampilTab('masuk'); });
  $('tab-daftar').addEventListener('click', function () { tampilTab('daftar'); });
  $('ke-daftar').addEventListener('click', function () { tampilTab('daftar'); $('d-nama').focus(); });
  $('ke-masuk').addEventListener('click', function () { tampilTab('masuk'); $('m-user').focus(); });
  if (window.location.hash === '#daftar') tampilTab('daftar');

  // ---------- Tombol mata ----------
  Array.prototype.forEach.call(document.querySelectorAll('.mata'), function (b) {
    var input = $(b.getAttribute('data-target'));
    b.addEventListener('click', function () {
      var terlihat = input.type === 'text';
      input.type = terlihat ? 'password' : 'text';
      b.classList.toggle('tampil', !terlihat);
      b.setAttribute('aria-pressed', String(!terlihat));
      b.setAttribute('aria-label', terlihat ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi');
      input.focus();
    });
  });

  // ---------- Sesi yang masih aktif ----------
  MaduraDB.siapkan().then(function () {
    return MaduraDB.sesiAktif();
  }).then(function (sesi) {
    if (!sesi) return;
    if (dariAplikasi) {
      return MaduraDB.keluar().then(function () { galat('galat-masuk', 'Sesi sebelumnya tidak valid. Silakan masuk lagi.'); });
    }
    keDashboard();
  }).catch(function (e) { console.error(e); });

  // ---------- Masuk dengan nama pengguna dan kata sandi ----------
  $('form-masuk').addEventListener('submit', function (e) {
    e.preventDefault();
    galat('galat-masuk', '');
    if (!$('m-user').value.trim() || !$('m-sandi').value) { galat('galat-masuk', 'Isi nama pengguna dan kata sandi.'); return; }
    $('tombol-masuk').disabled = true;
    MaduraDB.siapkan().then(function () {
      return MaduraDB.masuk($('m-user').value, $('m-sandi').value);
    }).then(function (berhasil) {
      if (berhasil) { keDashboard(); return; }
      galat('galat-masuk', 'Nama pengguna atau kata sandi salah.');
      $('m-sandi').value = '';
      $('m-sandi').focus();
      $('tombol-masuk').disabled = false;
    }).catch(function (err) {
      console.error(err);
      galat('galat-masuk', 'Database di browser tidak bisa dibuka. Matikan mode privat, lalu muat ulang.');
      $('tombol-masuk').disabled = false;
    });
  });

  // ---------- Daftar akun baru ----------
  $('form-daftar').addEventListener('submit', function (e) {
    e.preventDefault();
    galat('galat-daftar', '');
    var nama = $('d-nama').value.trim(), user = $('d-user').value.trim().toLowerCase();
    var sandi = $('d-sandi').value, ulang = $('d-ulang').value;
    if (!nama) { galat('galat-daftar', 'Nama lengkap wajib diisi.'); return; }
    if (nama.length > 30) { galat('galat-daftar', 'Nama lengkap maksimal 30 karakter.'); return; }
    if (!/^[a-z0-9_]{3,20}$/.test(user)) { galat('galat-daftar', 'Nama pengguna 3 sampai 20 karakter: huruf kecil, angka, atau garis bawah.'); return; }
    if (sandi.length < 6) { galat('galat-daftar', 'Kata sandi minimal 6 karakter.'); return; }
    if (sandi !== ulang) { galat('galat-daftar', 'Pengulangan kata sandi tidak sama.'); return; }
    $('tombol-daftar').disabled = true;
    MaduraDB.siapkan().then(function () {
      return MaduraDB.daftar(nama, user, sandi);
    }).then(function (berhasil) {
      if (berhasil) { keDashboard(); return; }
      throw new Error('Akun dibuat, tetapi gagal masuk. Silakan masuk manual.');
    }).catch(function (err) {
      galat('galat-daftar', err.message || 'Pendaftaran gagal. Coba lagi.');
      $('tombol-daftar').disabled = false;
    });
  });

  // ---------- Masuk dengan Google ----------
  var coba = 0;

  function googleMati(pesan) {
    $('tombol-google').textContent = '';
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'google-mati';
    b.textContent = 'Masuk dengan Google';
    b.addEventListener('click', function () { $('info-google').hidden = false; });
    $('tombol-google').appendChild(b);
    $('info-google').textContent = pesan;
  }

  // Isi token Google (JWT) dibaca di sini. Tanda tangannya tidak diperiksa karena semua data aplikasi
  // tersimpan di browser ini; yang diperiksa hanya penerbit, tujuan (Client ID), dan masa berlaku.
  function bacaToken(token) {
    var bagian = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var teks = decodeURIComponent(atob(bagian).split('').map(function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(teks);
  }

  function setelahGoogle(jawaban) {
    var id = KONFIGURASI.googleClientId, p;
    try { p = bacaToken(jawaban.credential); } catch (e) { galat('galat-masuk', 'Respons Google tidak bisa dibaca. Coba lagi.'); return; }
    var penerbitSah = p.iss === 'accounts.google.com' || p.iss === 'https://accounts.google.com';
    if (!penerbitSah || p.aud !== id || !(p.exp * 1000 > Date.now()) || !p.sub || p.email_verified === false) {
      galat('galat-masuk', 'Login Google ditolak. Coba lagi.');
      return;
    }
    MaduraDB.siapkan().then(function () {
      return MaduraDB.masukGoogle({ sub: p.sub, email: p.email, nama: p.name, foto: p.picture });
    }).then(keDashboard).catch(function (err) {
      console.error(err);
      galat('galat-masuk', err.message || 'Login Google gagal. Coba lagi.');
    });
  }

  function siapkanGoogle() {
    var id = (typeof KONFIGURASI !== 'undefined' && KONFIGURASI.googleClientId) || '';
    if (!id) { googleMati('Login Google belum diaktifkan. Pemilik aplikasi perlu mengisi Client ID di file konfigurasi.js.'); return; }
    if (!(window.google && google.accounts && google.accounts.id)) {
      if (++coba < 40) { setTimeout(siapkanGoogle, 250); return; }
      googleMati('Layanan Google tidak bisa dimuat. Periksa koneksi internet, lalu muat ulang halaman.');
      return;
    }
    google.accounts.id.initialize({ client_id: id, callback: setelahGoogle, ux_mode: 'popup' });
    google.accounts.id.renderButton($('tombol-google'), {
      type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', shape: 'rectangular',
      logo_alignment: 'left', width: Math.max(200, Math.min(400, $('tombol-google').clientWidth || 300))
    });
  }
  window.addEventListener('load', siapkanGoogle);
})();
</script>
</body>
